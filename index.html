<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shanzhai Fast Food Holo Cards</title>
  <style>
    :root {
      color-scheme: dark;
      --bg0: #080a10;
      --bg1: #171b2d;
      --ink: #f8fbff;
      --muted: rgba(248, 251, 255, .68);
      --panel: rgba(255,255,255,.07);
      --card-w: min(72vw, 430px);
      --rx: 0deg;
      --ry: 0deg;
      --vx: 0;
      --vy: 0;
      --mx: .5;
      --my: .45;
      --glow: .45;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 64, 191, .18), transparent 34%),
        radial-gradient(circle at 84% 12%, rgba(64, 202, 255, .18), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(255, 218, 73, .14), transparent 34%),
        linear-gradient(145deg, var(--bg0), var(--bg1));
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 34px 18px;
    }

    .app {
      width: min(1120px, 100%);
      min-height: min(780px, 100vh);
      display: grid;
      grid-template-columns: 1fr minmax(280px, var(--card-w)) 1fr;
      align-items: center;
      gap: clamp(20px, 4vw, 52px);
    }

    .title {
      align-self: end;
      padding-bottom: 48px;
    }

    .title small {
      display: block;
      margin-bottom: 18px;
      color: var(--muted);
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: 11px;
    }

    .title h1 {
      margin: 0;
      max-width: 280px;
      font-size: clamp(32px, 5vw, 64px);
      line-height: .92;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }

    .meta {
      align-self: start;
      padding-top: 64px;
      max-width: 280px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .meta b {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--ink);
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .stage {
      display: grid;
      place-items: center;
      perspective: 1400px;
      touch-action: none;
      user-select: none;
    }

    .tilt {
      width: var(--card-w);
      aspect-ratio: 1086 / 1448;
      transform-style: preserve-3d;
      transform:
        rotateX(var(--rx))
        rotateY(var(--ry));
      transition: transform 170ms ease-out;
      filter:
        drop-shadow(0 36px 36px rgba(0,0,0,.45))
        drop-shadow(0 0 28px rgba(68, 211, 255, .14));
    }

    .flipper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 980ms cubic-bezier(.2, .85, .16, 1);
      cursor: pointer;
    }

    .is-back .flipper {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: clamp(18px, 4vw, 32px);
      backface-visibility: hidden;
      transform-style: preserve-3d;
      background: #eef7ff;
      isolation: isolate;
    }

    .face::before {
      content: "";
      position: absolute;
      inset: -18%;
      z-index: 20;
      pointer-events: none;
      background:
        radial-gradient(circle at calc(var(--mx) * 100%) calc(var(--my) * 100%), rgba(255,255,255,.85), transparent 12%),
        conic-gradient(from 180deg at calc(var(--mx) * 100%) calc(var(--my) * 100%),
          rgba(255, 0, 153, .0),
          rgba(255, 0, 153, .32),
          rgba(0, 216, 255, .36),
          rgba(255, 255, 88, .32),
          rgba(130, 80, 255, .28),
          rgba(255, 0, 153, .0));
      mix-blend-mode: color-dodge;
      opacity: .62;
      transform: translateZ(90px);
    }

    .face::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 24;
      pointer-events: none;
      background:
        repeating-linear-gradient(104deg,
          rgba(255,255,255,.20) 0 1px,
          transparent 1px 6px),
        linear-gradient(115deg,
          transparent 0%,
          rgba(255,255,255,.32) calc((var(--mx) * 100%) - 12%),
          rgba(255,255,255,.0) calc((var(--mx) * 100%) + 18%),
          transparent 100%);
      mix-blend-mode: screen;
      opacity: .38;
      transform: translateZ(100px);
    }

    .back {
      transform: rotateY(180deg);
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      transform-style: preserve-3d;
      transition:
        opacity 420ms ease,
        filter 420ms ease,
        transform 140ms ease-out;
    }

    .background {
      z-index: 1;
      transform:
        translate3d(calc(var(--vx) * -16px), calc(var(--vy) * -16px), -34px)
        scale(1.055);
      filter: saturate(1.08) contrast(1.03);
    }

    .character {
      z-index: 5;
      transform:
        translate3d(calc(var(--vx) * 18px), calc(var(--vy) * 18px), 42px)
        scale(1.006);
    }

    .structure {
      z-index: 7;
      opacity: calc(var(--glow) * .65);
      mix-blend-mode: screen;
      filter:
        drop-shadow(0 0 8px rgba(84, 244, 255, .86))
        drop-shadow(0 0 18px rgba(255, 74, 235, .45));
      transform:
        translate3d(calc(var(--vx) * 18px), calc(var(--vy) * 18px), 45px)
        scale(1.006);
    }

    .text-layer {
      z-index: 12;
      transform:
        translate3d(calc(var(--vx) * 28px), calc(var(--vy) * 28px), 78px);
    }

    .frame-layer {
      z-index: 16;
      transform:
        translate3d(calc(var(--vx) * 34px), calc(var(--vy) * 34px), 92px);
    }

    .back-img {
      z-index: 3;
      object-fit: cover;
      filter: saturate(1.1) contrast(1.04);
      transform: translateZ(22px) scale(1.002);
    }

    .caption {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(620px, calc(100% - 28px));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
      text-align: center;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.24);
      background: var(--panel);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      letter-spacing: .08em;
      text-transform: uppercase;
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(255,255,255,.5);
      background: rgba(255,255,255,.12);
    }

    .status {
      min-width: 150px;
    }

    @media (max-width: 820px) {
      body { padding: 18px 14px 76px; }
      .app {
        min-height: calc(100vh - 100px);
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .title, .meta {
        justify-self: center;
        text-align: center;
        padding: 0;
      }
      .title h1 { max-width: 360px; }
      .meta { display: none; }
      :root { --card-w: min(82vw, 420px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tilt, .flipper, .layer { transition: none; }
      .face::before, .face::after { opacity: .25; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="title" aria-label="Project title">
      <small>Shanzhai Fast Food</small>
      <h1>Holo<br>Raster<br>Cards</h1>
    </section>

    <section class="stage" aria-label="Interactive holographic card">
      <div class="tilt" id="tilt">
        <div class="flipper" id="flipper" role="button" tabindex="0" aria-label="Flip card">
          <div class="face front" id="frontFace">
            <img class="layer background" id="backgroundLayer" alt="">
            <img class="layer character" id="characterLayer" alt="">
            <img class="layer structure" id="structureLayer" alt="">
            <img class="layer text-layer" id="textLayer" alt="">
            <img class="layer frame-layer" id="frameLayer" alt="">
          </div>
          <div class="face back" id="backFace">
            <img class="layer back-img" src="assets/card-back.png" alt="Card back design">
          </div>
        </div>
      </div>
    </section>

    <aside class="meta">
      <b id="cardName">KFG Interior</b>
      <div id="cardMeta">
        Tap once to reveal the shared back. Tap again to switch to the other shanzhai fast-food card.
      </div>
    </aside>
  </main>

  <div class="caption">
    <button id="motionBtn" type="button">Enable motion</button>
    <button id="recenterBtn" type="button">Recenter</button>
    <span class="status" id="statusText">Tap card to flip</span>
  </div>

  <script>
    const cards = [
      {
        id: "interior",
        name: "KFG Interior",
        meta: "A copycat fast-food interior card built from background, subject, text and frame layers.",
        background: "assets/interior-background.png",
        character: "assets/interior-character.png",
        structure: "assets/interior-structure.png",
        text: "assets/interior-text.png",
        frame: "assets/interior-frame.png"
      },
      {
        id: "tower",
        name: "Mackenzie Tower",
        meta: "A stacked shanzhai fast-food building card with floating signs, frame and UI text layers.",
        background: "assets/tower-background.png",
        character: "assets/tower-character.png",
        structure: "assets/tower-structure.png",
        text: "assets/tower-text.png",
        frame: "assets/tower-frame.png"
      }
    ];

    const root = document.documentElement;
    const tilt = document.getElementById("tilt");
    const flipper = document.getElementById("flipper");
    const cardName = document.getElementById("cardName");
    const cardMeta = document.getElementById("cardMeta");
    const statusText = document.getElementById("statusText");
    const motionBtn = document.getElementById("motionBtn");
    const recenterBtn = document.getElementById("recenterBtn");

    const layers = {
      background: document.getElementById("backgroundLayer"),
      character: document.getElementById("characterLayer"),
      structure: document.getElementById("structureLayer"),
      text: document.getElementById("textLayer"),
      frame: document.getElementById("frameLayer")
    };

    const params = new URLSearchParams(location.search);
    const paramCard = params.get("card");
    let currentIndex = Math.floor(Math.random() * cards.length);
    if (paramCard) {
      const found = cards.findIndex(card => card.id === paramCard);
      if (found >= 0) currentIndex = found;
    }
    let isBack = params.get("side") === "back";
    let pointerActive = false;
    let motionActive = false;
    let baseGamma = 0;
    let baseBeta = 0;
    let target = { x: 0, y: 0 };
    let view = { x: 0, y: 0 };
    let idleSeed = Math.random() * 1000;
    let lastTap = 0;

    function setCard(index) {
      const card = cards[index];
      layers.background.src = card.background;
      layers.character.src = card.character;
      layers.structure.src = card.structure;
      layers.text.src = card.text;
      layers.frame.src = card.frame;
      cardName.textContent = card.name;
      cardMeta.textContent = card.meta;
    }

    function otherRandomIndex() {
      if (cards.length <= 1) return currentIndex;
      let next = currentIndex;
      while (next === currentIndex) next = Math.floor(Math.random() * cards.length);
      return next;
    }

    function flip() {
      const now = performance.now();
      if (now - lastTap < 420) return;
      lastTap = now;

      if (!isBack) {
        isBack = true;
        tilt.classList.add("is-back");
        statusText.textContent = "Back side. Tap again to switch";
      } else {
        currentIndex = otherRandomIndex();
        setCard(currentIndex);
        isBack = false;
        tilt.classList.remove("is-back");
        statusText.textContent = `Front: ${cards[currentIndex].name}`;
      }
    }

    function setView(x, y, mx = (x + 1) / 2, my = (y + 1) / 2) {
      target.x = Math.max(-1, Math.min(1, x));
      target.y = Math.max(-1, Math.min(1, y));
      root.style.setProperty("--mx", Math.max(0, Math.min(1, mx)).toFixed(3));
      root.style.setProperty("--my", Math.max(0, Math.min(1, my)).toFixed(3));
    }

    function resetView() {
      motionActive = false;
      pointerActive = false;
      target.x = 0;
      target.y = 0;
      statusText.textContent = "Recentered";
    }

    function handlePointer(event) {
      const rect = tilt.getBoundingClientRect();
      const px = (event.clientX - rect.left) / rect.width;
      const py = (event.clientY - rect.top) / rect.height;
      setView((px - 0.5) * 2, (py - 0.5) * 2, px, py);
    }

    flipper.addEventListener("click", flip);
    flipper.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flip();
      }
    });

    tilt.addEventListener("pointerenter", () => { pointerActive = true; });
    tilt.addEventListener("pointermove", (event) => {
      pointerActive = true;
      motionActive = false;
      handlePointer(event);
    });
    tilt.addEventListener("pointerleave", () => {
      pointerActive = false;
    });

    recenterBtn.addEventListener("click", resetView);

    function onOrientation(event) {
      if (!motionActive) return;
      const gamma = event.gamma ?? 0;
      const beta = event.beta ?? 0;
      const x = (gamma - baseGamma) / 28;
      const y = (beta - baseBeta) / 34;
      setView(x, y, 0.5 + x * 0.35, 0.5 + y * 0.35);
    }

    motionBtn.addEventListener("click", async () => {
      try {
        if (typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function") {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== "granted") {
            statusText.textContent = "Motion permission denied";
            return;
          }
        }
        motionActive = true;
        pointerActive = false;
        baseGamma = 0;
        baseBeta = 0;
        window.addEventListener("deviceorientation", (event) => {
          if (baseGamma === 0 && baseBeta === 0) {
            baseGamma = event.gamma ?? 0;
            baseBeta = event.beta ?? 0;
          }
          onOrientation(event);
        }, { passive: true });
        statusText.textContent = "Motion enabled";
      } catch (error) {
        statusText.textContent = "Motion unavailable";
      }
    });

    function animate(time) {
      if (!pointerActive && !motionActive) {
        const t = time / 1000 + idleSeed;
        target.x = Math.sin(t * 0.72) * 0.13 + Math.sin(t * 1.31) * 0.05;
        target.y = Math.cos(t * 0.61) * 0.11 + Math.sin(t * 1.07) * 0.04;
        root.style.setProperty("--mx", (0.5 + target.x * 0.28).toFixed(3));
        root.style.setProperty("--my", (0.48 + target.y * 0.28).toFixed(3));
      }

      view.x += (target.x - view.x) * 0.085;
      view.y += (target.y - view.y) * 0.085;
      root.style.setProperty("--vx", view.x.toFixed(4));
      root.style.setProperty("--vy", view.y.toFixed(4));
      root.style.setProperty("--ry", `${(view.x * 12).toFixed(3)}deg`);
      root.style.setProperty("--rx", `${(-view.y * 12).toFixed(3)}deg`);
      root.style.setProperty("--glow", (0.25 + Math.abs(view.x) * 0.35 + Math.abs(view.y) * 0.22).toFixed(3));
      requestAnimationFrame(animate);
    }

    setCard(currentIndex);
    if (isBack) tilt.classList.add("is-back");
    statusText.textContent = isBack ? "Back side. Tap again to switch" : `Front: ${cards[currentIndex].name}`;
    requestAnimationFrame(animate);
  </script>
</body>
</html>
